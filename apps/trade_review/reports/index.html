<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易汇总仪表盘</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="header">
    <h1>交易汇总仪表盘</h1>
    <div class="controls">
      <p class="sub">数据源：成交报告单.xlsx</p>
      <label class="sub" for="themeSelect">主题：</label>
      <select id="themeSelect" class="theme-select">
        <option value="classic">经典（红涨绿跌）</option>
        <option value="dark">深色专业</option>
        <option value="bluegray">蓝灰商务</option>
      </select>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>每月盈亏</h2>
      <canvas id="monthlyChart" height="120"></canvas>
    </section>

    <section class="card">
      <h2>月份与该月操作个股</h2>
      <div id="monthsList" class="months"></div>
    </section>

    <section class="card">
      <h2>个股交易汇总</h2>
      <div id="stocksTable"></div>
    </section>
  </main>

  <footer class="footer">
    <span>响应式前端展示 · 交易复盘系统</span>
  </footer>

  <script src="assets/index.js"></script>
</body>
</html>
