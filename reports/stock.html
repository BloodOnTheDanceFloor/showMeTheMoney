<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个股详情</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="header">
    <h1 id="stockTitle">个股详情</h1>
    <div class="controls">
      <a class="back" href="index.html">返回汇总</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>概览</h2>
      <div id="stockSummary" class="summary"></div>
    </section>

    <section class="card">
      <h2>累计盈亏曲线</h2>
      <canvas id="stockEquityChart" height="120"></canvas>
    </section>

    <section class="card">
      <h2>交易明细（卖出撮合）</h2>
      <div id="stockTrades"></div>
      <canvas id="stockTradesChart" height="120"></canvas>
    </section>

    <section class="card">
      <h2>历史成交记录（原始）</h2>
      <div id="rawRecords"></div>
    </section>

    <section class="card">
      <h2>月度仪表盘</h2>
      <div class="controls" style="margin: 8px 0; gap: 8px;">
        <label class="sub" for="monthSelect">选择月份：</label>
        <select id="monthSelect" class="theme-select"></select>
      </div>
      <div id="monthSummary" class="summary"></div>
      <canvas id="monthEquityChart" height="120"></canvas>
    </section>
  </main>

  <footer class="footer">
    <span>响应式前端展示 · 交易复盘系统</span>
  </footer>

  <script src="assets/stock.js"></script>
</body>
</html>
